name: CI

# 触发：推送到 master、以及所有 pull_request
on:
  push:
    branches: [master]
  pull_request:

# 最小权限：CI 只读仓库内容（上传 artifact 不需要写权限）
permissions:
  contents: read

# 同一分支/PR 的新构建会取消旧构建，避免排队浪费 runner
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-lint-build:
    name: Unit tests + lint + debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run unit tests, lint and assemble debug
        run: ./gradlew testGithubDebugUnitTest lintGithubDebug assembleGithubDebug assembleFdroidRelease --console=plain

      # 失败也上传，便于定位是哪个单测 / 哪条 lint 规则出问题
      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/test-results/testGithubDebugUnitTest
          if-no-files-found: ignore

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: app/build/reports/lint-results*.html
          if-no-files-found: ignore
