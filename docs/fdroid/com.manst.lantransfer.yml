# 审查者常见问题的答复（提交 MR 时直接贴进描述）：
# * REQUEST_INSTALL_PACKAGES：fdroid flavor 已移除（app/src/fdroid/AndroidManifest.xml tools:node="remove"），
#   应用内更新通过 BuildConfig.IN_APP_UPDATES=false 关闭。
# * ACCESS_FINE/COARSE_LOCATION 带 maxSdkVersion=32，仅用于 Android 12 及以下加入热点；13+ 用 NEARBY_WIFI_DEVICES。
# * CAMERA 仅用于扫描局域网会话/热点二维码。
# * lint 中的 TrustAllX509TrustManager 属 FTPS 证书固定的显式分支，默认路径走严格校验。
