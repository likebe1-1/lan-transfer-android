Description: |-
  LanLink turns your phone into a LAN file server <b>and</b> a file transfer client — no cloud, no account. Run an FTP, FTPS, SFTP and SCP server on the phone and connect from a PC (FileZilla, WinSCP, Windows Explorer, ssh/scp) or another phone; or use it as a client to reach your NAS or any server. Everything stays on the local network.

  <b>Features:</b>

  * <b>Built-in server</b> — start an FTP, FTPS, SFTP and SCP server on the phone with one shared folder and browse it from a PC or another phone (passive FTP mode only).
  * <b>Client</b> — browse and transfer to/from a NAS or any FTP/FTPS/SFTP/SCP server, with resume, folders and a transfer queue.
  * <b>Phone-to-phone quick transfer</b> — pick files, get an 8-digit code or QR code, the other device receives them; folders, resume and auto-save into Downloads supported.
  * <b>Quick transfer</b> — pick files and a local server starts showing an 8-digit code; the other device enters the code or scans a QR code. Folders, resume and auto-save into the system Downloads folder are supported.
  * <b>Transfer queue</b> — 3 concurrent tasks, live speed/progress/ETA, automatic retry, history, and opening finished files from the notification or history list.
  * <b>Network tools</b> — LAN device discovery (with AP-isolation hints), network diagnostics, port reachability tests.
  * <b>One-click hotspot</b> — scan the hotspot QR code to join the sender's hotspot; works even when the router enforces AP isolation.
  
  <b>Security:</b>
  
  * Quick transfer pins the FTPS certificate and SSH host key by SHA-256 fingerprint (delivered through the QR code / LAN beacon), so a man-in-the-middle cannot impersonate the peer.
  * Automatic protocol fallback only uses encrypted transports (FTPS → SFTP → SCP); plain FTP must be selected explicitly.
  * Server-side authentication throttling: per-source escalating lockout plus a global failure-rate cap.
  * Saved server passwords are encrypted with Android Keystore (AES-256-GCM); allowBackup is disabled.
  * The update manifest is loaded over HTTPS only and verified with an Ed25519 signature.
  
  <b>Updating:</b>

  This build is distributed through F-Droid: updates are delivered by the F-Droid client, and the in-app updater is disabled in this variant. If you prefer in-app updates, install LanLink from GitHub or Gitee instead:

  * GitHub: https://github.com/likebe1-1/lan-transfer-android/releases
  * Gitee: https://gitee.com/likebe1-1/lanlink-android/releases

  <b>Privacy:</b>
  
  No data collection, no ads, no analytics, no crash reporting. Files never leave the local network.

