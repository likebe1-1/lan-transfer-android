<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
  html,body{margin:0;padding:0;width:1280px;height:720px;overflow:hidden;font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
  .wrap{position:relative;width:1280px;height:720px;background:linear-gradient(135deg,#0b1220 0%,#12305c 55%,#1a4a8f 100%);display:flex;align-items:center;justify-content:space-between;padding:0 72px;box-sizing:border-box;color:#eaf1ff}
  .left{max-width:520px}
  .brand{display:flex;align-items:center;gap:18px;margin-bottom:26px}
  .brand img{width:88px;height:88px;border-radius:22px;box-shadow:0 12px 30px rgba(0,0,0,.45)}
  .brand h1{font-size:52px;margin:0;letter-spacing:1px}
  .brand .sub{font-size:17px;color:#9fc0ee;margin-top:6px}
  h2{font-size:30px;line-height:1.35;margin:0 0 18px;font-weight:700}
  h2 em{color:#8fd0ff;font-style:normal}
  ul{margin:0;padding-left:22px;font-size:19px;line-height:1.75;color:#cfe0ff}
  .shots{display:flex;gap:18px;align-items:center}
  .phone{width:200px;height:410px;border-radius:26px;overflow:hidden;border:3px solid rgba(255,255,255,.28);box-shadow:0 18px 40px rgba(0,0,0,.5);background:#0a1018}
  .phone img{width:100%;height:100%;object-fit:cover;object-position:top}
</style></head><body>
<div class="wrap">
  <div class="left">
    <div class="brand">
      <img src="../site/logo.svg" alt="">
      <div>
        <h1>LanLink</h1>
        <div class="sub">局域网传输 · FTP / FTPS / SFTP / SCP</div>
      </div>
    </div>
    <h2>两台设备连上同一 Wi‑Fi，<br><em>文件直接送达。</em></h2>
    <ul>
      <li>四种协议 · 手机也能当服务器</li>
      <li>8 位接收码 / 扫码即传</li>
      <li>文件夹 · 断点续传 · 传输队列</li>
      <li>证书指纹固定 · 不经过云端</li>
    </ul>
  </div>
  <div class="shots">
    <div class="phone"><img src="../screenshots/01_server_list.png" alt=""></div>
    <div class="phone"><img src="../screenshots/11_quick_send_session.png" alt=""></div>
    <div class="phone"><img src="../screenshots/04_transfer_queue.png" alt=""></div>
  </div>
</div>
</body></html>
